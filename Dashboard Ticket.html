<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Ticket</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#e5e7eb;--a:#2563eb;--b:#16a34a;--w:#d97706;--r:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#191c21;--tx:#e8eaed;--mu:#9aa0a8;--bd:#2a2e35;--a:#60a5fa;--b:#4ade80;--w:#fbbf24;--r:#f87171}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#191c21;--tx:#e8eaed;--mu:#9aa0a8;--bd:#2a2e35;--a:#60a5fa;--b:#4ade80;--w:#fbbf24;--r:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:0 0 10px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,label.f{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.k .l{color:var(--mu);font-size:12px}.k .v{font-size:26px;font-weight:650}.k .s{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar .n{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis}
.bar .t{flex:1;background:var(--bd);border-radius:4px;height:10px}.bar .t i{display:block;height:100%;border-radius:4px;background:var(--a)}
.tag{padding:1px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
.ok{color:var(--b)}.bad{color:var(--r)}.mu{color:var(--mu)}
.lg span{margin-right:12px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#msg{color:var(--mu);font-size:12px}
</style>
</head>
<body>
<div class="w">
<header>
  <div><h1>📊 Dashboard Ticket</h1><div id="msg"></div></div>
  <div class="ctl">
    <label>Ngày: <select id="day"></select></label>
    <label class="f">Tải file .xlsx<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  </div>
</header>
<div class="g" id="kpi"></div>
<div class="g2">
  <div class="c"><h2>Ticket mới vs Ticket đã resolve (theo ngày)</h2>
    <div class="lg"><span><i style="background:var(--a)"></i>Mới</span><span><i style="background:var(--b)"></i>Resolved</span></div>
    <div class="sc"><svg id="chart" height="220"></svg></div></div>
  <div class="c"><h2>Số lượng theo mức ưu tiên (P4 → P48) — toàn bộ dữ liệu</h2><div class="sc"><table id="pri"></table></div></div>
</div>
<div class="g2">
  <div class="c"><h2>Theo loại ticket (Type)</h2><div id="type"></div></div>
  <div class="c"><h2>Theo Priority</h2><div id="prio"></div></div>
  <div class="c"><h2>Theo trạng thái</h2><div id="stat"></div></div>
</div>
<div class="c"><h2 id="lt">Danh sách ticket trong ngày</h2><div class="sc" style="max-height:460px;overflow:auto"><table id="list"></table></div></div>
</div>

 {"Ticket_id": "TK-00495", "Ngày": "2026-09-27 16:47:14", "From": "Dương Thị Mai", "Priority": "Medium", "Type": "Question", "Status": "Need support", "Status.1": "Mới", "Date resolved": NaN, "Type SLA": "P3 - 24h"}, {"Ticket_id": "TK-00496", "Ngày": "2026-09-27 17:29:04", "From": "Phạm Đức Tâm", "Priority": "Low", "Type": "Service Request", "Status": "In progress", "Status.1": "Đang xử lý", "Date resolved": NaN, "Type SLA": "P4 - 48h"}, {"Ticket_id": "TK-00497", "Ngày": "2026-09-27 17:49:33", "From": "Đỗ Đức Phúc", "Priority": "Medium", "Type": "Service Request", "Status": "Cancelled", "Status.1": "Hủy", "Date resolved": NaN, "Type SLA": "P3 - 24h"}, {"Ticket_id": "TK-00498", "Ngày": "2026-09-27 17:52:41", "From": "Trần Văn Vy", "Priority": "Urgent", "Type": "Incident", "Status": "Resolved", "Status.1": "Xong", "Date resolved": "2026-09-27 21:02:00", "Type SLA": "P1 - 4h"}, {"Ticket_id": "TK-00499", "Ngày": "2026-09-27 18:10:26", "From": "Phan Gia Quân", "Priority": "Low", "Type": "Incident", "Status": "In progress", "Status.1": "Đang xử lý", "Date resolved": NaN, "Type SLA": "P4 - 48h"}, {"Ticket_id": "TK-00500", "Ngày": "2026-09-27 20:31:38", "From": "Trương Bảo Nam", "Priority": "Urgent", "Type": "Account/Access", "Status": "Closed", "Status.1": "Xong", "Date resolved": "2026-09-27 22:24:08", "Type SLA": "P1 - 4h"}];
let T=[];
const p2=n=>String(n).padStart(2,'0');
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  const d=new Date(String(v).trim().replace(' ','T'));return isNaN(d)?null:d;
}
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function norm(r){
  const c=toDate(r['Ngày']),s=toDate(r['Date resolved']);
  const m=String(r['Type SLA']??'').match(/P(\d+)\s*-\s*(\d+)\s*h/i);
  const st2=r['Status.1']||'', cx=/hủy|cancel/i.test(st2+(r['Status']||''));
  return {id:r['Ticket_id'],from:r['From']||'',c,s,pr:r['Priority']||'Chưa gán',lim:m?+m[2]:null,slaL:m?`P${m[1]} - ${m[2]}h`:'',
    type:r['Type']||'Chưa phân loại',st:r['Status']||'—',st2,cx,done:!!s};
}
const hrs=t=>(t.s-t.c)/36e5;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fh=h=>h==null?'—':h<1?Math.round(h*60)+' phút':h.toFixed(1)+' giờ';
function load(rows){
  T=rows.map(norm).filter(t=>t.c);
  const days=new Set();T.forEach(t=>{days.add(dk(t.c));if(t.s)days.add(dk(t.s))});
  const a=[...days].sort().reverse(), sel=document.getElementById('day');
  sel.innerHTML=a.map(d=>`<option>${d}</option>`).join('');
  sel.value=dk(new Date(Math.max(...T.map(t=>t.c))));
  document.getElementById('msg').textContent=`${T.length} ticket · ${T.filter(t=>t.done).length} đã resolve`;
  render();
}
function render(){
  const day=document.getElementById('day').value; if(!day)return;
  const end=new Date(day+'T23:59:59.999');
  const nw=T.filter(t=>dk(t.c)===day), rs=T.filter(t=>t.s&&dk(t.s)===day);
  const backlog=T.filter(t=>t.c<=end&&!t.cx&&(!t.s||t.s>end)).length;
  const allDone=T.filter(t=>t.done), sla=T.filter(t=>t.done&&t.lim);
  const met=sla.filter(t=>hrs(t)<=t.lim).length;
  const kp=(l,v,s='')=>`<div class="c k"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  document.getElementById('kpi').innerHTML=
    kp('Ticket mới trong ngày',nw.length,'xuất hiện ngày '+day)+
    kp('Ticket resolve trong ngày',rs.length,nw.length?`Tỷ lệ resolve/mới: ${Math.round(rs.length/nw.length*100)}%`:'')+
    kp('Backlog cuối ngày',backlog,'chưa resolve, không tính ticket Hủy')+
    kp('SLA – TB thời gian resolve',fh(avg(allDone.map(hrs))),`toàn bộ · ngày này: ${fh(avg(rs.map(hrs)))}`)+
    kp('% đạt SLA (P4→P48)',sla.length?Math.round(met/sla.length*100)+'%':'—',sla.length?`${met}/${sla.length} ticket có Type SLA`:'chưa có Type SLA');
  // chart: 14 ngày kết thúc tại ngày chọn
  const ds=[];for(let i=13;i>=0;i--){const d=new Date(day+'T00:00:00');d.setDate(d.getDate()-i);ds.push(dk(d))}
  const N=ds.map(d=>T.filter(t=>dk(t.c)===d).length), R=ds.map(d=>T.filter(t=>t.s&&dk(t.s)===d).length);
  const mx=Math.max(1,...N,...R), W=Math.max(560,ds.length*44), H=220, bw=14;
  let s='';ds.forEach((d,i)=>{const x=i*44+12,h1=N[i]/mx*150,h2=R[i]/mx*150;
    s+=`<rect x="${x}" y="${180-h1}" width="${bw}" height="${h1}" rx="2" fill="var(--a)"/><rect x="${x+bw+2}" y="${180-h2}" width="${bw}" height="${h2}" rx="2" fill="var(--b)"/>`;
    if(N[i])s+=`<text x="${x+bw/2}" y="${176-h1}" text-anchor="middle" font-size="10" fill="var(--tx)">${N[i]}</text>`;
    if(R[i])s+=`<text x="${x+bw*1.5+2}" y="${176-h2}" text-anchor="middle" font-size="10" fill="var(--tx)">${R[i]}</text>`;
    s+=`<text x="${x+bw}" y="200" text-anchor="middle" font-size="10" fill="var(--mu)" ${d===day?'font-weight="700"':''}>${d.slice(8)}/${d.slice(5,7)}</text>`});
  const ch=document.getElementById('chart');ch.setAttribute('width',W);ch.setAttribute('viewBox',`0 0 ${W} ${H}`);ch.innerHTML=s;
  // priority
  let h='<tr><th>Mức SLA</th><th>Tổng</th><th>Resolved</th><th>Đang mở</th><th>Hủy</th><th>TB resolve</th><th>Đạt SLA</th></tr>';
  const row=(lb,a,lim)=>{const d=a.filter(t=>t.done),m=lim?d.filter(t=>hrs(t)<=lim).length:0,cx=a.filter(t=>t.cx&&!t.done).length;
    return `<tr><td><span class="tag">${lb}</span></td><td>${a.length}</td><td>${d.length}</td><td>${a.length-d.length-cx}</td><td>${cx}</td><td>${fh(avg(d.map(hrs)))}</td><td>${lim&&d.length?`<span class="${m/d.length>=.9?'ok':'bad'}">${m}/${d.length} (${Math.round(m/d.length*100)}%)</span>`:'<span class="mu">—</span>'}</td></tr>`};
  [...new Map(T.filter(t=>t.lim).map(t=>[t.lim,t])).values()].sort((a,b)=>a.lim-b.lim).forEach(x=>h+=row(x.slaL,T.filter(t=>t.lim===x.lim),x.lim));
  if(T.some(t=>!t.lim))h+=row('Chưa gán',T.filter(t=>!t.lim),0);
  document.getElementById('pri').innerHTML=h;
  // type & status
  const grp=(f)=>{const m={};T.forEach(t=>{const k=f(t);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=e=>{const M=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="bar"><span class="n" title="${k}">${k}</span><span class="t"><i style="width:${v/M*100}%"></i></span><b>${v}</b></div>`).join('')};
  document.getElementById('type').innerHTML=bars(grp(t=>t.type));
  document.getElementById('stat').innerHTML=bars(grp(t=>t.st2||t.st));
  const po=['Urgent','High','Medium','Low'];document.getElementById('prio').innerHTML=bars(grp(t=>t.pr).sort((a,b)=>po.indexOf(a[0])-po.indexOf(b[0])));
  // list
  const L=[...new Map([...nw,...rs].map(t=>[t.id,t])).values()];
  document.getElementById('lt').textContent=`Ticket trong ngày ${day} (${L.length})`;
  const tm=d=>d?p2(d.getHours())+':'+p2(d.getMinutes())+' '+p2(d.getDate())+'/'+p2(d.getMonth()+1):'—';
  document.getElementById('list').innerHTML='<tr><th>ID</th><th>Người gửi</th><th>Priority</th><th>SLA</th><th>Type</th><th>Tạo lúc</th><th>Resolve lúc</th><th>Thời gian xử lý</th><th>Trạng thái</th></tr>'+
    (L.map(t=>`<tr><td>${t.id}</td><td>${t.from}</td><td>${t.pr}</td><td>${t.slaL||'—'}</td><td>${t.type}</td><td>${tm(t.c)}</td><td>${tm(t.s)}</td><td>${t.done?fh(hrs(t)):'—'}</td><td>${t.done?(t.lim&&hrs(t)>t.lim?'<span class="bad">Xong (quá SLA)</span>':'<span class="ok">Xong</span>'):t.st2}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">Không có ticket</td></tr>');
}
document.getElementById('day').onchange=render;
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
    load(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null}));
  }catch(x){document.getElementById('msg').textContent='Không đọc được file: '+x.message}};
  r.readAsArrayBuffer(f);
};
load(EMBED);
</script>
