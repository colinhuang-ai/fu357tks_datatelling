<title>Danh mục laptop LaTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a filter rail on the left, a spec table on the right. Under 860px the rail folds behind a button; under 760px table rows become cards. */
  :root {
    --bg: #f2f5f8;
    --surface: #ffffff;
    --surface-2: #e9eef3;
    --line: #d7dee6;
    --line-strong: #b4c0cc;
    --fg: #111a24;
    --muted: #586677;
    --accent: #0d6b88;
    --accent-fg: #ffffff;
    --accent-soft: #dbeef5;
    --tag-bg: #f8e3ee;
    --tag-fg: #9c1650;
    --v-intel: #1f6fd1;
    --v-amd: #d94a1f;
    --v-nvidia: #4f9a0a;
    --v-apple: #66727f;
    --v-qualcomm: #8245cc;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b; --surface: #151d26; --surface-2: #1d2833; --line: #27333f; --line-strong: #3a4857;
      --fg: #e7edf3; --muted: #93a2b2; --accent: #4cc2e0; --accent-fg: #06222b; --accent-soft: #16323d;
      --tag-bg: #3a1626; --tag-fg: #ff9cc4;
      --v-intel: #5aa8ff; --v-amd: #ff7a52; --v-nvidia: #8ed130; --v-apple: #aeb9c5; --v-qualcomm: #b48cff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e141b; --surface: #151d26; --surface-2: #1d2833; --line: #27333f; --line-strong: #3a4857;
    --fg: #e7edf3; --muted: #93a2b2; --accent: #4cc2e0; --accent-fg: #06222b; --accent-soft: #16323d;
    --tag-bg: #3a1626; --tag-fg: #ff9cc4;
    --v-intel: #5aa8ff; --v-amd: #ff7a52; --v-nvidia: #8ed130; --v-apple: #aeb9c5; --v-qualcomm: #b48cff;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; }
  @media (min-width: 720px) { .app { padding-inline: 28px; } }

  /* Header */
  .head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
  .eyebrow { margin: 0; font: 500 12px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 800 clamp(1.9rem, 4.5vw, 2.75rem)/1.05 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
  .lede { margin: 4px 0 0; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }

  /* Buttons + form controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .link { border: 0; background: none; padding: 4px 0; color: var(--accent); cursor: pointer; font-size: 13px; }
  .link:hover { text-decoration: underline; }
  .badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font: 600 11px/1.5 var(--font-mono); text-align: center; }
  input[type="search"], select { min-height: 38px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--fg); }
  input[type="search"]::placeholder { color: var(--muted); }

  /* Filter rail */
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 16px 16px; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 6px; }
  .rail-head h2 { margin: 0; font: 700 18px/1.2 var(--font-display); }
  .facet { border-top: 1px solid var(--line); padding-block: 10px; }
  .facet summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; padding: 4px 0; font: 600 12px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  .facet summary::-webkit-details-marker { display: none; }
  .facet summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  .facet[open] summary::after { transform: rotate(-135deg); }
  .facet-body { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .facet-body input[type="search"] { width: 100%; }
  .opts.scroll { max-height: 232px; overflow: auto; margin-inline: -4px; padding-inline: 4px; }
  .grp { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 8px 4px 4px; background: var(--surface); color: var(--muted); font: 600 11px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  .opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .opt:hover { background: var(--surface-2); }
  .opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .opt-name { overflow-wrap: anywhere; }
  .opt-count { font: 400 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  .opt.is-zero { opacity: .45; cursor: default; }
  .opt.is-zero:hover { background: none; }
  .none { margin: 6px 4px; color: var(--muted); font-size: 13px; }
  .mobile-only { display: none; }

  .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .v-intel { background: var(--v-intel); } .v-amd { background: var(--v-amd); } .v-nvidia { background: var(--v-nvidia); }
  .v-apple { background: var(--v-apple); } .v-qualcomm { background: var(--v-qualcomm); }

  /* Results */
  .results { min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .toolbar #search { flex: 1 1 220px; min-width: 0; }
  .sel { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .sel select { min-width: 0; color: var(--fg); }
  .filter-bar { display: none; margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 8px 4px 12px; border: 0; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 13px; cursor: pointer; text-align: left; }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip span[aria-hidden] { font-size: 16px; line-height: 1; }
  .summary { margin: 14px 0 10px; color: var(--muted); font-size: 14px; }
  .summary b { color: var(--fg); font: 600 14px var(--font-mono); font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; }
  th { padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); color: var(--muted); font: 600 11px/1.2 var(--font-mono); letter-spacing: .08em; text-align: left; text-transform: uppercase; white-space: nowrap; }
  td { padding: 12px 14px; vertical-align: middle; }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
  .num { text-align: right; white-space: nowrap; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
  .num small { display: block; margin-top: 1px; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .nm { font-weight: 600; overflow-wrap: anywhere; }
  .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; margin-top: 2px; color: var(--muted); font: 400 12px/1.6 var(--font-mono); }
  .sub > span + span::before { content: "·"; margin-right: 8px; }
  .pill { padding: 0 7px; border-radius: 99px; background: var(--tag-bg); color: var(--tag-fg); font: 600 10.5px/1.7 var(--font-body); letter-spacing: .05em; text-transform: uppercase; }
  .sub > .pill::before { content: none; margin: 0; }
  .cl { display: flex; align-items: baseline; gap: 8px; }
  .cl .dot { transform: translateY(-1px); }
  .cl span:last-child { overflow-wrap: anywhere; }

  .empty { padding: 40px 16px; border: 1px dashed var(--line-strong); border-radius: 8px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 12px; }

  .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
  .pager:empty { display: none; }
  .pg { min-width: 38px; height: 38px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; cursor: pointer; }
  .pg:hover:not(:disabled):not([aria-current]) { background: var(--surface-2); }
  .pg[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: default; }
  .pg:disabled { opacity: .4; cursor: default; }
  .pg-gap { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; color: var(--muted); }
  .note { margin: 20px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; max-width: 72ch; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .rail { display: none; position: static; max-height: none; }
    .rail.open { display: block; }
    .filter-bar { display: flex; }
    .filter-bar .btn { width: 100%; justify-content: space-between; }
    .mobile-only { display: flex; width: 100%; margin-top: 14px; }
  }
  @media (max-width: 760px) {
    input[type="search"], select { font-size: 16px; }
    .table-wrap { overflow: visible; background: none; border: 0; }
    table, tbody { display: block; min-width: 0; }
    thead { display: none; }
    tbody { display: grid; gap: 10px; }
    tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    td { display: block; min-width: 0; padding: 0; border: 0 !important; background: none !important; }
    td.c-name, td.c-chip { grid-column: 1 / -1; }
    td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 2px; color: var(--muted); font: 600 10.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
    .num { text-align: left; white-space: normal; }
    .pg { min-width: 36px; padding: 0 6px; }
    .pg .lbl { display: none; }
    .sel { flex: 1 1 140px; }
    .sel select { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .facet summary::after { transition: none; } }
</style>

<div class="app">
  <header class="head">
    <p class="eyebrow" id="eyebrow">LLT_LaptopModel</p>
    <h1>Danh mục laptop</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="filter-bar">
    <button type="button" class="btn" id="filterToggle" aria-expanded="false" aria-controls="rail">
      <span id="filterToggleText">Hiện bộ lọc</span> <span class="badge" id="filterBadge" hidden>0</span>
    </button>
  </div>

  <div class="layout">
    <aside class="rail" id="rail" aria-label="Bộ lọc">
      <div class="rail-head">
        <h2>Bộ lọc</h2>
        <button type="button" class="link" id="clearRail" hidden>Xóa tất cả</button>
      </div>

      <details class="facet" open>
        <summary><span>Hãng</span> <span class="badge" id="badge-brand" hidden></span></summary>
        <div class="facet-body"><div class="opts" id="opts-brand"></div></div>
      </details>

      <details class="facet" open>
        <summary><span>CPU</span> <span class="badge" id="badge-cpu" hidden></span></summary>
        <div class="facet-body">
          <input type="search" id="find-cpu" placeholder="Tìm CPU, ví dụ Ultra 7" aria-label="Tìm CPU" autocomplete="off">
          <div class="opts scroll" id="opts-cpu"></div>
          <p class="none" id="none-cpu" hidden>Không có CPU nào khớp.</p>
        </div>
      </details>

      <details class="facet" open>
        <summary><span>GPU</span> <span class="badge" id="badge-gpu" hidden></span></summary>
        <div class="facet-body">
          <input type="search" id="find-gpu" placeholder="Tìm GPU, ví dụ RTX 4060" aria-label="Tìm GPU" autocomplete="off">
          <div class="opts scroll" id="opts-gpu"></div>
          <p class="none" id="none-gpu" hidden>Không có GPU nào khớp.</p>
        </div>
      </details>

      <button type="button" class="btn primary mobile-only" id="closeRail">Xem <span id="railCount">0</span> laptop</button>
    </aside>

    <main class="results">
      <div class="toolbar" id="toolbar">
        <input type="search" id="search" placeholder="Tìm theo tên máy" aria-label="Tìm theo tên máy" autocomplete="off">
        <label class="sel">Sắp xếp
          <select id="sort">
            <option value="new">Mới nhất</option>
            <option value="name">Tên A–Z</option>
            <option value="weight">Nhẹ nhất</option>
            <option value="battery">Pin lớn nhất</option>
          </select>
        </label>
        <label class="sel">Mỗi trang
          <select id="size">
            <option value="12">12</option>
            <option value="24">24</option>
            <option value="48">48</option>
          </select>
        </label>
      </div>

      <div class="chips" id="chips"></div>
      <p class="summary" id="summary" aria-live="polite"></p>

      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Laptop</th>
              <th scope="col">CPU</th>
              <th scope="col">GPU</th>
              <th scope="col" class="num">Màn hình</th>
              <th scope="col" class="num">Cân nặng</th>
              <th scope="col" class="num">Pin</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="empty" id="empty" hidden>
        <p>Không có laptop nào khớp bộ lọc hiện tại.</p>
        <button type="button" class="btn" id="clearEmpty">Xóa bộ lọc</button>
      </div>

      <nav class="pager" id="pager" aria-label="Phân trang"></nav>
      <p class="note" id="note"></p>
    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var VI = new Intl.Collator('vi', { numeric: true, sensitivity: 'base' });
  var $ = function (id) { return document.getElementById(id); };
  var fold = function (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase(); };
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); };
  var vclass = function (v) { return 'v-' + v.toLowerCase(); };

  var L = D.laptops.map(function (l) {
    var brand = D.brands[l.b].n;
    return Object.assign({}, l, {
      brand: brand, cpu: D.cpus[l.c].n, gpu: D.gpus[l.g].n,
      cv: D.cpus[l.c].v, gv: D.gpus[l.g].v, key: fold(l.n + ' ' + brand)
    });
  });

  var F = {
    brand: { field: 'b', label: 'Hãng', items: D.brands },
    cpu: { field: 'c', label: 'CPU', items: D.cpus, order: ['Intel', 'AMD', 'Apple', 'Qualcomm'] },
    gpu: { field: 'g', label: 'GPU', items: D.gpus, order: ['NVIDIA', 'AMD', 'Intel', 'Apple', 'Qualcomm'] }
  };
  var S = { brand: new Set(), cpu: new Set(), gpu: new Set(), q: '', sort: 'new', size: 12, page: 1 };

  function nl(a, b, dir) {
    if (a == null && b == null) return 0;
    if (a == null) return 1;
    if (b == null) return -1;
    return (a - b) * dir;
  }
  var SORTS = {
    'new': function (a, b) { return ((b.y || 0) - (a.y || 0)) || VI.compare(a.n, b.n); },
    name: function (a, b) { return VI.compare(a.n, b.n); },
    weight: function (a, b) { return nl(a.wt, b.wt, 1) || VI.compare(a.n, b.n); },
    battery: function (a, b) { return nl(a.bat, b.bat, -1) || VI.compare(a.n, b.n); }
  };

  function match(l, skip) {
    if (skip !== 'brand' && S.brand.size && !S.brand.has(l.b)) return false;
    if (skip !== 'cpu' && S.cpu.size && !S.cpu.has(l.c)) return false;
    if (skip !== 'gpu' && S.gpu.size && !S.gpu.has(l.g)) return false;
    if (S.q && l.key.indexOf(S.q) < 0) return false;
    return true;
  }

  /* ---------- Build the filter lists once ---------- */
  function buildFacet(key) {
    var f = F[key], host = $('opts-' + key), html = '';
    f.refs = {};
    function row(it) {
      return '<label class="opt" data-i="' + it.i + '" data-k="' + esc(fold(it.n)) + '">' +
        '<input type="checkbox" data-f="' + key + '" value="' + it.i + '">' +
        '<span class="opt-name">' + esc(it.n) + '</span><span class="opt-count"></span></label>';
    }
    if (f.order) {
      var vendors = f.order.concat(f.items.map(function (i) { return i.v; }).filter(function (v, i, a) { return a.indexOf(v) === i && f.order.indexOf(v) < 0; }));
      vendors.forEach(function (v) {
        var its = f.items.filter(function (i) { return i.v === v; }).sort(function (a, b) { return VI.compare(a.n, b.n); });
        if (!its.length) return;
        html += '<div class="grp-wrap"><div class="grp"><span class="dot ' + vclass(v) + '"></span>' + esc(v) + '</div>' + its.map(row).join('') + '</div>';
      });
    } else {
      var tot = {};
      L.forEach(function (l) { tot[l[f.field]] = (tot[l[f.field]] || 0) + 1; });
      html = f.items.slice().sort(function (a, b) { return (tot[b.i] || 0) - (tot[a.i] || 0) || VI.compare(a.n, b.n); }).map(row).join('');
    }
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll('.opt'), function (el) {
      f.refs[el.getAttribute('data-i')] = { el: el, input: el.querySelector('input'), count: el.querySelector('.opt-count') };
    });
  }
  ['brand', 'cpu', 'gpu'].forEach(buildFacet);

  function filterList(key, raw) {
    var q = fold(raw.trim()), any = false, host = $('opts-' + key);
    Array.prototype.forEach.call(host.querySelectorAll('.grp-wrap'), function (w) {
      var vis = 0;
      Array.prototype.forEach.call(w.querySelectorAll('.opt'), function (o) {
        var show = !q || o.getAttribute('data-k').indexOf(q) >= 0;
        o.hidden = !show;
        if (show) vis++;
      });
      w.hidden = !vis;
      if (vis) any = true;
    });
    $('none-' + key).hidden = any;
  }

  /* ---------- Rendering ---------- */
  var kg = function (g) { return g ? (g / 1000).toFixed(2) + ' kg' : '—'; };
  var wh = function (w) { return w ? (+w.toFixed(1)) + ' Wh' : '—'; };

  function rowHtml(l) {
    var res = (l.w && l.h) ? '<small>' + l.w + ' × ' + l.h + '</small>' : '';
    return '<tr>' +
      '<td class="c-name"><div class="nm">' + esc(l.n) + '</div><div class="sub"><span>' + esc(l.brand) + '</span><span>' + l.y + '</span>' +
        (l.gm ? '<span class="pill">Gaming</span>' : '') + '</div></td>' +
      '<td class="c-chip" data-label="CPU"><div class="cl"><span class="dot ' + vclass(l.cv) + '"></span><span>' + esc(l.cpu) + '</span></div></td>' +
      '<td class="c-chip" data-label="GPU"><div class="cl"><span class="dot ' + vclass(l.gv) + '"></span><span>' + esc(l.gpu) + '</span></div></td>' +
      '<td class="num" data-label="Màn hình">' + (l.sz ? l.sz + '"' : '—') + res + '</td>' +
      '<td class="num" data-label="Cân nặng">' + kg(l.wt) + '</td>' +
      '<td class="num" data-label="Pin">' + wh(l.bat) + '</td></tr>';
  }

  function pageItems(p, n) {
    var set = {};
    [1, n, p - 1, p, p + 1].forEach(function (x) { if (x >= 1 && x <= n) set[x] = 1; });
    var nums = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
    var out = [];
    nums.forEach(function (x, i) {
      if (i) {
        var prev = nums[i - 1];
        if (x - prev === 2) out.push(prev + 1);
        else if (x - prev > 2) out.push('gap');
      }
      out.push(x);
    });
    return out;
  }

  function renderPager(p, n) {
    if (n <= 1) { $('pager').innerHTML = ''; return; }
    var h = '<button type="button" class="pg" data-p="' + (p - 1) + '"' + (p === 1 ? ' disabled' : '') + ' aria-label="Trang trước"><span aria-hidden="true">‹</span><span class="lbl"> Trước</span></button>';
    pageItems(p, n).forEach(function (x) {
      if (x === 'gap') h += '<span class="pg-gap" aria-hidden="true">…</span>';
      else h += '<button type="button" class="pg" data-p="' + x + '"' + (x === p ? ' aria-current="page"' : '') + ' aria-label="Trang ' + x + '">' + x + '</button>';
    });
    h += '<button type="button" class="pg" data-p="' + (p + 1) + '"' + (p === n ? ' disabled' : '') + ' aria-label="Trang sau"><span class="lbl">Sau </span><span aria-hidden="true">›</span></button>';
    $('pager').innerHTML = h;
  }

  function renderChips() {
    var h = '', n = 0;
    Object.keys(F).forEach(function (key) {
      S[key].forEach(function (id) {
        n++;
        h += '<button type="button" class="chip" data-f="' + key + '" data-i="' + id + '" aria-label="Bỏ lọc ' + esc(F[key].label + ' ' + F[key].items[id].n) + '"><b>' + F[key].label + '</b> ' + esc(F[key].items[id].n) + ' <span aria-hidden="true">×</span></button>';
      });
    });
    if (n) h += '<button type="button" class="link" data-clear="1">Xóa tất cả</button>';
    $('chips').innerHTML = h;
    return n;
  }

  function update() {
    var res = L.filter(function (l) { return match(l); }).sort(SORTS[S.sort]);

    Object.keys(F).forEach(function (key) {
      var f = F[key], c = {};
      L.forEach(function (l) { if (match(l, key)) c[l[f.field]] = (c[l[f.field]] || 0) + 1; });
      Object.keys(f.refs).forEach(function (id) {
        var r = f.refs[id], n = c[id] || 0, zero = n === 0 && !r.input.checked;
        r.count.textContent = n;
        r.el.classList.toggle('is-zero', zero);
        r.input.disabled = zero;
      });
      var b = $('badge-' + key);
      b.textContent = S[key].size;
      b.hidden = !S[key].size;
    });

    var active = renderChips();
    $('clearRail').hidden = !active;
    $('filterBadge').textContent = active;
    $('filterBadge').hidden = !active;
    $('railCount').textContent = res.length;

    var pages = Math.max(1, Math.ceil(res.length / S.size));
    if (S.page > pages) S.page = pages;
    var start = (S.page - 1) * S.size, slice = res.slice(start, start + S.size);

    $('rows').innerHTML = slice.map(rowHtml).join('');
    $('tableWrap').hidden = !res.length;
    $('empty').hidden = !!res.length;
    $('summary').innerHTML = res.length
      ? 'Hiển thị <b>' + (start + 1) + '–' + (start + slice.length) + '</b> trong <b>' + res.length + '</b> laptop'
      : 'Không có kết quả';
    renderPager(S.page, pages);
  }

  /* ---------- Events ---------- */
  function go(resetPage) { if (resetPage) S.page = 1; update(); }

  $('rail').addEventListener('change', function (e) {
    var t = e.target;
    if (t.type !== 'checkbox') return;
    var set = S[t.getAttribute('data-f')], id = Number(t.value);
    if (t.checked) set.add(id); else set.delete(id);
    go(true);
  });
  $('find-cpu').addEventListener('input', function (e) { filterList('cpu', e.target.value); });
  $('find-gpu').addEventListener('input', function (e) { filterList('gpu', e.target.value); });

  function clearAll() {
    ['brand', 'cpu', 'gpu'].forEach(function (k) {
      S[k].clear();
      Object.keys(F[k].refs).forEach(function (id) { F[k].refs[id].input.checked = false; });
    });
    go(true);
  }
  $('clearRail').addEventListener('click', clearAll);
  $('clearEmpty').addEventListener('click', function () {
    S.q = ''; $('search').value = '';
    clearAll();
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.getAttribute('data-clear')) { clearAll(); return; }
    var k = b.getAttribute('data-f'), id = Number(b.getAttribute('data-i'));
    S[k].delete(id);
    F[k].refs[id].input.checked = false;
    go(true);
  });

  $('search').addEventListener('input', function (e) { S.q = fold(e.target.value.trim()); go(true); });
  $('sort').addEventListener('change', function (e) { S.sort = e.target.value; go(true); });
  $('size').addEventListener('change', function (e) { S.size = Number(e.target.value); go(true); });

  $('pager').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]');
    if (!b || b.disabled) return;
    S.page = Number(b.getAttribute('data-p'));
    update();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('toolbar').scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
  });

  function setRail(open) {
    $('rail').classList.toggle('open', open);
    $('filterToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    $('filterToggleText').textContent = open ? 'Ẩn bộ lọc' : 'Hiện bộ lọc';
  }
  $('filterToggle').addEventListener('click', function () { setRail(!$('rail').classList.contains('open')); });
  $('closeRail').addEventListener('click', function () {
    setRail(false);
    $('toolbar').scrollIntoView({ block: 'start' });
  });

  /* ---------- Static copy from the data ---------- */
  var years = L.map(function (l) { return l.y; }).filter(Boolean);
  var m = D.meta;
  $('eyebrow').textContent = m.source.replace(/_/g, ' · ').replace(/(\d{4})(\d{2})(\d{2})/, '$3.$2.$1');
  $('lede').textContent = L.length + ' laptop từ ' + D.brands.length + ' hãng, ra mắt ' + Math.min.apply(null, years) + '–' + Math.max.apply(null, years) + '.';
  $('note').textContent = 'Nguồn: ' + m.source + ', ghép với Brand, CpuModel và GpuModel. Đã bỏ ' + m.hidden +
    ' dòng không hiển thị hoặc ngừng hoạt động (gồm các dòng test) và ' + m.device +
    ' thiết bị không phải laptop (điện thoại, máy tính bảng, Mac Studio). CPU và GPU trùng tên được gộp thành một mục lọc. Cân nặng đổi sang kg.';

  update();
})();
</script>
